<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ready to Focus Better</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Arial, sans-serif;
    background:#f5f7ff;
    padding:60px 20px;
}

.container{
    max-width:1100px;
    margin:auto;
    text-align:center;
}

.content h1{
    font-size:52px;
    color:#252538;
    margin-bottom:15px;
    font-weight:700;
}

.content p{
    color:#8b8b99;
    font-size:18px;
    margin-bottom:25px;
}

.btn{
    display:inline-block;
    background:#4f46e5;
    color:white;
    text-decoration:none;
    padding:14px 30px;
    border-radius:10px;
    font-size:15px;
    font-weight:600;
    transition:0.3s;
}

.btn:hover{
    background:#4338ca;
}

.banner{
    margin-top:50px;
    display:flex;
    justify-content:center;
}

.banner img{
    width:100%;
    max-width:850px;
    border-radius:40px;
    display:block;
}


@media(max-width:768px){

    .content h1{
        font-size:36px;
    }

    .content p{
        font-size:16px;
    }

    .banner img{
        border-radius:25px;
    }
}
</style>
</head>
<body>

<div class="container">

    <div class="content">
        <h1>Ready to focus better</h1>

        <p>
            This template instantly leveled up our presence.
            – Studio Vertex
        </p>

        <a href="#" class="btn">Get Started Free</a>
    </div>

    <div class="banner">
        <img src="wc-big.png" alt="Webflow Conference Banner">
    </div>

</div>

</body>
</html>
