<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Productive Users</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Arial, sans-serif;
    background:#f5f7ff;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.stats-section{
    width:80%;
    max-width:1100px;
    background:#e9e8ff;
    border-radius:20px;
    padding:50px 30px;
    text-align:center;
}

.stats-section h2{
    font-size:40px;
    color:#252538;
    margin-bottom:50px;
}

.stats-container{
    display:flex;
    justify-content:space-around;
    align-items:center;
    flex-wrap:wrap;
    gap:30px;
}

.stat-item h1{
    font-size:72px;
    color:#4f46e5;
    font-weight:700;
}

.stat-item p{
    font-size:20px;
    color:#7d7d8d;
    margin-top:10px;
}

/* Responsive */

@media(max-width:768px){

    .stats-section{
        width:90%;
        padding:40px 20px;
    }

    .stats-section h2{
        font-size:28px;
    }

    .stats-container{
        flex-direction:column;
    }

    .stat-item h1{
        font-size:55px;
    }

    .stat-item p{
        font-size:18px;
    }
}

</style>
</head>
<body>

<section class="stats-section">

    <h2>Joined Thousands of Productive Users</h2>

    <div class="stats-container">

        <div class="stat-item">
            <h1>50K</h1>
            <p>Active Users</p>
        </div>

        <div class="stat-item">
            <h1>2M+</h1>
            <p>Focus Sessions</p>
        </div>

        <div class="stat-item">
            <h1>95%</h1>
            <p>Satisfaction Rate</p>
        </div>

    </div>

</section>

</body>
</html>
